
apiVersion: v1
kind: Service
metadata:
  namespace: twsss
  name: pmxp-admin
  labels:
    app.name: twsss-pmxp-admin
spec:
  {{- if not .Values.admin.assign_cluster_ip }}
  clusterIP: None
  {{- end }}
  ports:
  - name: admin-3000
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app.name: twsss-pmxp-admin

---

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: twsss
  name: pmxp-admin-wl
  {{- template "plane.labelsAndAnnotations" .Values.admin }}
spec:
  replicas: {{ .Values.admin.replicas | default 1 }}
  selector:
    matchLabels:
      app.name: twsss-pmxp-admin
  template:
    metadata:
      namespace: twsss
      labels:
        app.name: twsss-pmxp-admin
      annotations:
        timestamp: {{ now | quote }}
    spec:
      containers:
      - name: pmxp-admin
        imagePullPolicy: {{ .Values.admin.pullPolicy | default "Always" }}
        image: {{ .Values.admin.image }}
        stdin: true
        tty: true
        resources:
          requests:
            memory: {{ .Values.admin.memoryRequest | default "50Mi" | quote }}
            cpu: {{ .Values.admin.cpuRequest | default "50m" | quote }}
          limits:
            memory: {{ .Values.admin.memoryLimit  | default "1000Mi" | quote }}
            cpu: {{ .Values.admin.cpuLimit | default "500m" | quote}}
      {{- include "plane.podScheduling" .Values.admin }}
      serviceAccount: pmxp-srv-account
      serviceAccountName: pmxp-srv-account
---
