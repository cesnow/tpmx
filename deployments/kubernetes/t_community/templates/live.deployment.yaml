
apiVersion: v1
kind: Service
metadata:
  namespace: twsss
  name: pmxp-live
  labels:
    app.name: twsss-pmxp-live
spec:
  {{- if not .Values.live.assign_cluster_ip }}
  clusterIP: None
  {{- end }}
  ports:
  - name: live-3000
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app.name: twsss-pmxp-live

---

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: twsss
  name: pmxp-live-wl
  {{- template "plane.labelsAndAnnotations" .Values.live }}
spec:
  replicas: {{ .Values.live.replicas | default 1 }}
  selector:
    matchLabels:
      app.name: twsss-pmxp-live
  template:
    metadata:
      namespace: twsss
      labels:
        app.name: twsss-pmxp-live
      annotations:
        timestamp: {{ now | quote }}
    spec:
      containers:
      - name: pmxp-live
        imagePullPolicy: {{ .Values.live.pullPolicy | default "Always" }}
        image: {{ .Values.live.image }}
        stdin: true
        tty: true
        resources:
          requests:
            memory: {{ .Values.live.memoryRequest | default "50Mi" | quote }}
            cpu: {{ .Values.live.cpuRequest | default "50m" | quote }}
          limits:
            memory: {{ .Values.live.memoryLimit  | default "1000Mi" | quote }}
            cpu: {{ .Values.live.cpuLimit | default "500m" | quote}}
        envFrom:
          - configMapRef:
              name: pmxp-live-vars
              optional: false
          - secretRef:
              name: {{ .Values.external_secrets.vault_name }}
              optional: false
      {{- include "plane.podScheduling" .Values.live }}
      serviceAccount: pmxp-srv-account
      serviceAccountName: pmxp-srv-account
---
