apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plane-proxy.fullname" . }}
  labels:
    {{- include "plane-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "plane-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plane-proxy.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods whenever the Caddyfile changes.
        checksum/config: {{ tpl (.Files.Get "files/Caddyfile") . | sha256sum }}
    spec:
      containers:
        - name: caddy
          image: "{{ .Values.image.url }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - name: http
              containerPort: 80
          # No env vars: FILE_SIZE_LIMIT / BUCKET_NAME / TRUSTED_PROXIES are
          # baked into the Caddyfile by Helm (tpl) from values.yaml.
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: caddyfile
          configMap:
            name: {{ include "plane-proxy.fullname" . }}-caddyfile
